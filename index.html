<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Character Archive — a growing collection of cinematic visual stories devoted to remarkable characters and performers.">
    <meta name="theme-color" content="#07090f">
    <title>Character Archive</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="archive-data.js" defer></script>
    <script src="script.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#archive">Skip to character selection</a>

    <header class="site-header">
      <a class="brand" href="index.html" aria-label="Character Archive home">
        <span class="brand__mark" aria-hidden="true">CA</span>
        <span class="brand__copy">
          <strong>Character Archive</strong>
          <small>Visual stories · 2026</small>
        </span>
      </a>
      <p class="site-header__counter" data-archive-counter aria-live="polite"></p>
    </header>

    <main class="archive-shell">
      <header class="archive-intro">
        <div>
          <p class="archive-intro__eyebrow">Curated character files</p>
          <h1>Choose a <span>story.</span></h1>
        </div>
        <p class="archive-intro__copy">A growing collection of visual portraits, each with its own atmosphere, rhythm, and point of view.</p>
      </header>

      <section class="archive" id="archive" aria-label="Choose a character archive"></section>
      <noscript class="no-script">JavaScript is required to assemble the character collection.</noscript>
    </main>

    <template id="portal-template">
      <a class="portal" href="#">
        <span class="portal__scene" aria-hidden="true"></span>
        <span class="portal__shade" aria-hidden="true"></span>
        <span class="portal__number" aria-hidden="true"></span>
        <span class="portal__content">
          <span class="portal__eyebrow"></span>
          <span class="portal__name" aria-hidden="true"></span>
          <span class="portal__surname"></span>
          <span class="portal__description"></span>
          <span class="portal__action">Enter archive <span class="portal__arrow" aria-hidden="true">↗</span></span>
        </span>
        <img class="portal__figure" src="" alt="" aria-hidden="true">
        <span class="sr-only"></span>
      </a>
    </template>

    <footer class="site-footer">
      <span>Character Archive</span>
      <span class="site-footer__line" aria-hidden="true"></span>
      <span>A collection designed to grow</span>
    </footer>
  </body>
</html>
